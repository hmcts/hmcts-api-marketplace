name: Site build and gates

on:
  # Deliberately unfiltered. The ruleset on main requires the build-and-gate
  # check, and a paths filter does not skip a job -- it never creates it, so a
  # PR outside the filter waits forever for a check that never arrives. It also
  # meant the live-site guard below never ran on the doc-only PRs it exists to
  # catch.
  pull_request:
  workflow_dispatch:

jobs:
  build-and-gate:
    runs-on: ubuntu-latest

    env:
      # The accessibility gate drives a real Chrome rather than a bundled
      # Chromium (see .puppeteerrc.cjs). ubuntu-latest ships one here.
      CHROME_PATH: /usr/bin/google-chrome

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the live-site guard can diff against the base
          # branch. The default shallow single-branch fetch leaves
          # origin/<base_ref> undefined, which failed with
          # "fatal: bad revision".
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install build tooling
        run: npm ci

      - name: Install the Prototype Kit
        working-directory: prototype-kit
        run: npm ci

      - name: Assert the top-level govuk-frontend is 6.x or newer
        working-directory: prototype-kit
        run: |
          v=$(node -p "require('govuk-frontend/package.json').version")
          case "$v" in
            6.*|7.*) echo "govuk-frontend $v OK" ;;
            *) echo "Expected govuk-frontend 6.x or newer at top level, got $v"; exit 1 ;;
          esac

      - name: Confirm Chrome is available to the accessibility gate
        run: |
          test -x "$CHROME_PATH" || { echo "No Chrome at $CHROME_PATH"; exit 1; }
          "$CHROME_PATH" --version

      # PORT is pinned deliberately: the Kit prompts interactively when its port
      # is busy and dies on closed stdin, which would hang this job.
      - name: Start the Prototype Kit
        working-directory: prototype-kit
        run: PORT=3100 npm run dev &

      - name: Wait for the Kit
        run: npx wait-on http://localhost:3100 --timeout 120000

      - name: Export the site
        run: npm run export

      # docs/ is committed output. If it differs from a fresh export, the
      # generated site has drifted from the Kit source it claims to come from.
      - name: Fail if the committed export is stale
        run: |
          if ! git diff --quiet docs; then
            echo "::error::docs/ differs from a fresh export. Run 'npm run export' and commit the result."
            git diff --stat docs
            git diff docs | head -100
            exit 1
          fi
          echo "Committed export matches a fresh build."

      # Before trusting the gates, prove they still fail when they should.
      - name: Verify the gates
        run: npm run verify-gates

      - name: Run the gates
        run: npm run gates

      # The archives must stay byte-identical. docs/ is now the live site -
      # v2 has been promoted to the publishing root - so the old guard's
      # subject no longer exists. What still needs protecting is archive/,
      # which holds the superseded v0 and v1 generations: an archive that
      # quietly changes is not an archive.
      #
      # Compares content, not paths, so relocating an archived file passes
      # while editing one fails.
      - name: Guard the archives
        if: github.base_ref != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

          # Both the new and old locations are listed, so the same content is
          # found wherever it sits. Before promotion the archived generations
          # live at docs/v0 and docs/v1; after it, under archive/. Naming only
          # the new location would make the promotion itself look like 61
          # additions rather than a relocation - the same path assumption this
          # check exists to avoid.
          archive_blobs () {
            git ls-tree -r "$1" -- archive docs/v0 docs/v1 | awk '{print $3}' | sort
          }

          archive_blobs "origin/$BASE_REF" > /tmp/base-blobs
          archive_blobs HEAD > /tmp/head-blobs

          if ! diff -q /tmp/base-blobs /tmp/head-blobs > /dev/null; then
            echo "::error::This change alters archive/. The superseded v0 and v1 generations must stay untouched. Relocating files is allowed; changing their content is not."
            git diff --stat "origin/$BASE_REF" -- archive
            exit 1
          fi
          echo "Archive content unchanged ($(wc -l < /tmp/head-blobs | tr -d ' ') file(s))."

      - name: Stop the Kit
        if: always()
        run: pkill -f govuk-prototype-kit || true
